# Production-oriented long-context preset. Native MTP is deliberately omitted:
# on this M1 Max its extra 248K-vocabulary projection costs more than verification
# saves, even at 100% draft acceptance. Turbo4 compresses only the growing KV;
# the target model itself and serial decoder remain unchanged.
[profiles.mlx-vlm-qwen38-q4-turbo4]
engine = "mlx-vlm"
description = "RECOMMENDED: Qwen3.8 27B Q4 serial decode + Turbo4 KV; 262K ceiling and exact-prefix reuse"
