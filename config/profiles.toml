# Official Qwen3.8-27B affine-Q4 target paired with the exact DFlash2 draft.
# The proposal model is already affine-Q4, so do not quantize it a second time.
# Target KV8 plus the draft's 2K sliding window keeps the 262K ceiling practical
# on a 32 GiB machine. Upstream prefix snapshots cannot serialize QuantizedKVCache,
# so this capacity profile disables snapshots instead of failing after prefill.
[profiles.mlx-dflash2-qwen38-q4]
engine = "mlx-dflash"
description = "RECOMMENDED CAPACITY: Qwen3.8 27B Q4 + DFlash2 Q4, KV8, guarded 96K context"
port = 8098
health_path = "/v1/models"
command = [
