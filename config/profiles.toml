[settings]
log_dir = "logs"
runtime_dir = "run"
startup_timeout_seconds = 600
shutdown_timeout_seconds = 20
minimum_available_gib = 6.0

# The exact HauhauCS aggressive model is GGUF-only. This is the conservative
# first profile for a 32 GiB M1 Max running the normal macOS GUI.
[profiles.llama-turbo4-safe]
engine = "llama.cpp"
description = "DEFAULT: HauhauCS 35B Q4_K_P, native 262K, q8 K + Turbo4 V (46.3 short / 31.2 at 8K tok/s)"
port = 8097
health_path = "/health"
command = [
  "{LLAMA_BIN}",
  "-m", "{GGUF_MODEL}",
  "--host", "0.0.0.0", "--port", "8097",
  "--gpu-layers", "all", "--fit", "off", "--no-host",
  "--threads", "10", "--threads-batch", "10",
  "--ctx-size", "262144", "--parallel", "1",
  "--batch-size", "2048", "--ubatch-size", "1024",
  "--flash-attn", "on",
  "--cache-type-k", "q8_0", "--cache-type-v", "turbo4",
  "--ctx-checkpoints", "2", "--checkpoint-min-step", "256",
  "--cache-ram", "1536", "--no-cont-batching",
  "--jinja", "--reasoning", "off", "--reasoning-format", "none",
  "--no-warmup", "--metrics"
]

[profiles.llama-turbo4-max]
engine = "llama.cpp"
description = "HauhauCS 35B Q4_K_P, native 262K context, maximum symmetric Turbo4 compression"
port = 8097
health_path = "/health"
command = [
  "/usr/bin/env", "TURBO_AUTO_ASYMMETRIC=0", "{LLAMA_BIN}",
  "-m", "{GGUF_MODEL}",
  "--host", "0.0.0.0", "--port", "8097",
  "--gpu-layers", "all", "--fit", "off", "--no-host",
  "--threads", "4", "--threads-batch", "8",
  "--ctx-size", "262144", "--parallel", "1",
  "--batch-size", "2048", "--ubatch-size", "512",
  "--flash-attn", "on",
  "--cache-type-k", "turbo4", "--cache-type-v", "turbo4",
  "--ctx-checkpoints", "2", "--checkpoint-min-step", "256",
  "--cache-ram", "0", "--no-cont-batching",
  "--jinja", "--reasoning", "off", "--reasoning-format", "none",
  "--no-warmup", "--metrics"
]

